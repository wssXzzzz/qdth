name: Build and test
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test core and sync merge logic
        run: swift test
      - name: Build iOS app and share extension without signing
        run: xcodebuild -project Inkflow.xcodeproj -scheme Inkflow -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
